# DeepSearch Agents 本地服务环境
# （MySQL 业务数据 + 本地 embedding 服务 + Qdrant 向量库 + Elasticsearch 关键词索引）
#
# 运行位置：在项目根目录执行
#   docker compose --env-file .env -f docker/docker-compose.yaml up -d
# 首次启动时，mysql/mysql.sql 会被官方镜像自动导入到 deepsearch_db。
# 如果数据卷已存在，MySQL 不会重复执行初始化脚本，需要重建 volume 才会重新导入。
#
# 服务都是「可选」的，缺任何一个系统仍能跑：
#   mysql        业务数据信源（未启动时数据库查询助手不可用）
#   embedding    自建 RAG 的向量化后端（见 ADR-006 / ADR-015）：HuggingFace text-embeddings-inference
#                **GPU 版**镜像加载 bge-m3，提供原生 /embed 与 OpenAI 兼容的 /v1/embeddings（1024 维）。
#                模型文件需放在 .workbuddy/models/bge-m3/（约 2.2GB，不入 git）。
#                GPU 需 Docker Desktop 已注册 nvidia-container-runtime（本机已通）。
#   qdrant       向量库（见 ADR-007）：存放 chunk 向量，与关键词路组成双路检索
#   elasticsearch 关键词检索路（见 ADR-008）：自建镜像装 IK 中文分词，
#                与 Qdrant 对称——Qdrant 存向量、ES 存原文倒排索引
#   kibana       可选可视化（profile: kibana），按需启动：
#                docker compose --env-file .env -f docker/docker-compose.yaml --profile kibana up -d kibana
#   reranker     精排 cross-encoder（bge-reranker-v2-m3，profile: rerank），按需启动：
#                docker compose --env-file .env -f docker/docker-compose.yaml --profile rerank up -d reranker
#                模型文件需放在 docker/reranker/bge-reranker-v2-m3/（约 2.2GB，不入 git）
#
# 降级行为：embedding / qdrant / elasticsearch 任一未启动时，检索自动降级——
# ES 不可达则关键词路回退进程内 rank_bm25，Qdrant 不可达则向量路缺席，
# 最差情况仍有纯关键词检索可用，不影响系统其余功能。
# reranker 容器是早期 TEI 形态，已被**进程内 ONNX 精排**取代（ADR-012）：生产检索
# 走 reranker.py 的 CUDA 推理，不依赖本服务。保留仅作回顾对照与离线实验，
# 需要时 --profile rerank 启动即可。

name: deepsearch-agents

services:
  mysql:
    image: mysql:8.4
    container_name: ds-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-deepsearch_db}
      TZ: Asia/Shanghai
    # 与 Python 连接配置保持一致，避免中文字段或日期时间在导入、查询时出现偏差
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --sql-mode=TRADITIONAL
    ports:
      # .env.example 默认使用 3307，避免和本机已有 MySQL 的 3306 端口冲突
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - deepsearch_mysql_data:/var/lib/mysql
      # 只读挂载初始化 SQL，容器首次创建数据目录时会自动执行
      - ./mysql/mysql.sql:/docker-entrypoint-initdb.d/01-init-pharma.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  embedding:
    # 生产向量模型 = bge-m3（568M / 24 层 / vocab 250k，XLM-RoBERTa，1024 维，CLS pooling）。
    # 2026-10-12 由 bge-large-zh-v1.5 切换而来：「中→英」跨语言召回向量层 Rec@5 33.3%→66.7%
    # （离线探针，见 docs/eval-testset-v3.md §7.10）。同为 1024 维 ⇒ Qdrant collection 无需变更。
    # GPU 版推理镜像（tag `1.8` = 通用 CUDA 版，覆盖 Ada/sm_89，即本机 RTX 4060）。
    # 2026-10-12 由 cpu-1.8 换而来：CPU 推理实测仅 ~1 块/秒（2367 块要 40 分钟），
    # 换 GPU 后同样的重编码降到分钟级。**换的是引擎不是模型**——bge-m3 权重不动。
    image: ghcr.io/huggingface/text-embeddings-inference:1.8
    platform: linux/amd64
    container_name: ds-embedding
    restart: unless-stopped
    command: ["--json-output", "--pooling", "cls", "--auto-truncate", "--tokenization-workers", "4"]
    ports:
      # 对应 .env 的 EMBEDDING_BASE_URL=http://localhost:8081/v1
      - "${EMBEDDING_PORT:-8081}:80"
    environment:
      MODEL_ID: /models/bge-m3
      # ⚠️ CPU 时代的约束：16384 / 4096 都在 warmup 阶段 OOM（Exit 137）——元凶是**主机 RAM**
      # （Docker VM 仅 7.6 GiB）里那份 4096 token 的注意力矩阵。换 GPU 后激活张量落在显存，
      # 主机内存不再是瓶颈，故放宽到 4096（配合自动截断，480 字符的块永不触发截断）。
      # 若显存吃紧（评测时 reranker 也要 ~3GB），可回落到 2048。
      MAX_CONCURRENT_REQUESTS: "8"
      MAX_BATCH_TOKENS: "4096"
    volumes:
      # 模型目录在 .workbuddy/models/（已 gitignore，不入 git；.workbuddy 不删）
      - ../.workbuddy/models/bge-m3:/models/bge-m3:ro
    # 把宿主 GPU 透给容器（Docker Desktop 已注册 nvidia-container-runtime）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      # 568M 模型在 CPU 上冷启动需要较长时间，给足预热窗口
      start_period: 300s

  qdrant:
    # 向量库（见 ADR-007）：chunk 向量的持久化与相似度检索
    image: qdrant/qdrant:v1.16
    container_name: ds-qdrant
    restart: unless-stopped
    ports:
      # 6333 = REST API + Web dashboard（http://localhost:6333/dashboard）
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      # 向量持久化：容器重建后索引仍在，不必重新摄入
      - deepsearch_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  elasticsearch:
    # 关键词检索路（见 ADR-008）：IK 中文分词 + 倒排索引 + BM25 打分
    # 自建镜像只做一件事——把 analysis-ik 插件装进去（插件包随仓库提供，构建不联网）
    build: ./elasticsearch
    image: deepsearch-elasticsearch:8.19.10
    container_name: ds-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # 本地开发关闭 xpack 安全：省去证书与账号配置（生产环境必须开启）
      xpack.security.enabled: "false"
      # 本机总内存约 8GB，且要同时跑 embedding（1.3G 模型）与 qdrant；
      # 617 个 chunk 的索引极小，512MB heap 绰绰有余，
      # 不限制的话 ES 会按宿主内存取一半（2GB+）把机器吃紧
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      TZ: Asia/Shanghai
    ports:
      # 默认 9201，避开本机可能已被占用的 9200（如电商问数项目的 elasticsearch 容器）
      - "${ES_PORT:-9201}:9200"
    volumes:
      - deepsearch_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  kibana:
    # 可选可视化：ES 的数据浏览与检索调试（对应 Qdrant 自带的 dashboard）
    # 默认不启动，需要时用 --profile kibana 显式开启（镜像约 2.1GB）
    image: kibana:8.19.10
    container_name: ds-kibana
    profiles: ["kibana"]
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      TZ: Asia/Shanghai
    ports:
      # 默认 5602，避开电商问数项目 kibana 用的 5601
      - "${KIBANA_PORT:-5602}:5601"
    volumes:
      - deepsearch_kibana_data:/usr/share/kibana/data
    depends_on:
      elasticsearch:
        condition: service_healthy

  reranker:
    # 精排层（cross-encoder）：把融合后的候选池逐对重排。
    # 效果已验证（阶段 0，39 查询）：Recall@5 59.3% → 84.3%，跨语言组提升最大。
    #
    # ⚠️ 本机（纯 CPU + candle 后端）三个已知限制，务必了解：
    #   1) 慢——每个候选约 400ms 线性累加，深度 15（池约 21 条）单查询重排约 8.8s；
    #   2) 不稳——TEI candle CPU 后端持续压测下约每 10 个请求 SIGSEGV 崩一次
    #      （core/src/queue.rs:87 队列 bug，可复现）；
    #   3) 崩溃会连带 Docker Desktop 的 WSL2 VM 一起崩，WSL 为每次崩溃在
    #      %LOCALAPPDATA%\Temp\wsl-crashes\ 写一份 ~3GB 内存转储（实测 3 次 = 9.5GB，
    #      曾把 C 盘吃到只剩 2.8G）。批量压测后请检查并清理该目录。
    # 因此 restart 用有限次的 on-failure:5，而非 unless-stopped——避免崩溃后无限重启、
    # 无限写转储。
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    platform: linux/amd64
    container_name: ds-reranker
    profiles: ["rerank"]
    restart: "on-failure:5"
    command:
      - "--json-output"
      - "--auto-truncate"
      - "--tokenization-workers"
      - "4"
      - "--max-client-batch-size"
      - "32"
    ports:
      # 对应 .env 的 RERANKER_URL=http://localhost:8082/rerank
      - "${RERANKER_PORT:-8082}:80"
    environment:
      MODEL_ID: /models/bge-reranker-v2-m3
      # CPU 上并发再高会互相争抢，反而更慢；8 是实测可用值
      MAX_CONCURRENT_REQUESTS: "8"
      # ⚠️ 关键：8192 会在 warmup 阶段 OOM（Exit 137），必须保持 4096。
      # 元凶是 warmup 的激活内存，不是模型本体（2.2G fp32）；常驻约 2.9~3.0 GiB。
      MAX_BATCH_TOKENS: "4096"
      # candle CPU 后端的推理线程数
      RAYON_NUM_THREADS: "8"
    volumes:
      # 模型目录随项目走，不依赖外部路径；已在 .gitignore 排除
      - ./reranker/bge-reranker-v2-m3:/models/bge-reranker-v2-m3:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      # 2.2GB fp32 模型在 CPU 上冷启动很慢，给足预热窗口
      start_period: 300s

volumes:
  deepsearch_mysql_data:
  deepsearch_qdrant_data:
  deepsearch_es_data:
  deepsearch_kibana_data:
