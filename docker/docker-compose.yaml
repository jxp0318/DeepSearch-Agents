# DeepSearch Agents 本地服务环境
# （MySQL 业务数据 + 本地 embedding 服务 + Qdrant 向量库 + Elasticsearch 关键词索引）
#
# 运行位置：在项目根目录执行
#   docker compose --env-file .env -f docker/docker-compose.yaml up -d
# 首次启动时，mysql/mysql.sql 会被官方镜像自动导入到 deepsearch_db。
# 如果数据卷已存在，MySQL 不会重复执行初始化脚本，需要重建 volume 才会重新导入。
#
# 服务都是「可选」的，缺任何一个系统仍能跑：
#   mysql        业务数据信源（未启动时数据库查询助手不可用）
#   embedding    自建 RAG 的向量化后端（见 ADR-006）：HuggingFace text-embeddings-inference
#                加载 bge-large-zh-v1.5，提供原生 /embed 与 OpenAI 兼容的 /v1/embeddings（1024 维）。
#                模型文件需放在 docker/embedding/bge-large-zh-v1.5/（约 1.3GB，不入 git）
#   qdrant       向量库（见 ADR-007）：存放 chunk 向量，与关键词路组成双路检索
#   elasticsearch 关键词检索路（见 ADR-008）：自建镜像装 IK 中文分词，
#                与 Qdrant 对称——Qdrant 存向量、ES 存原文倒排索引
#   kibana       可选可视化（profile: kibana），按需启动：
#                docker compose --env-file .env -f docker/docker-compose.yaml --profile kibana up -d kibana
#
# 降级行为：embedding / qdrant / elasticsearch 任一未启动时，检索自动降级——
# ES 不可达则关键词路回退进程内 rank_bm25，Qdrant 不可达则向量路缺席，
# 最差情况仍有纯关键词检索可用，不影响系统其余功能。

name: deepsearch-agents

services:
  mysql:
    image: mysql:8.4
    container_name: deepsearch-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-deepsearch_db}
      TZ: Asia/Shanghai
    # 与 Python 连接配置保持一致，避免中文字段或日期时间在导入、查询时出现偏差
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --sql-mode=TRADITIONAL
    ports:
      # .env.example 默认使用 3307，避免和本机已有 MySQL 的 3306 端口冲突
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - deepsearch_mysql_data:/var/lib/mysql
      # 只读挂载初始化 SQL，容器首次创建数据目录时会自动执行
      - ./mysql/mysql.sql:/docker-entrypoint-initdb.d/01-init-pharma.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  embedding:
    # CPU 版推理镜像；本地已有该镜像时不会重新拉取（约 938MB）
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    platform: linux/amd64
    container_name: deepsearch-embedding
    restart: unless-stopped
    command: ["--json-output"]
    ports:
      # 对应 .env 的 EMBEDDING_BASE_URL=http://localhost:8081/v1
      - "${EMBEDDING_PORT:-8081}:80"
    environment:
      MODEL_ID: /models/bge-large-zh-v1.5
      # bge-large-zh-v1.5 最大输入 512 token，超长会返回 413；
      # 摄入侧已把 chunk 控制在 400 字符以内，此处保持默认不自动截断便于暴露配置问题
      MAX_CONCURRENT_REQUESTS: "16"
      MAX_BATCH_TOKENS: "16384"
    volumes:
      # 模型目录随项目走，不依赖任何外部项目；文件较大，已在 .gitignore 中排除
      - ./embedding/bge-large-zh-v1.5:/models/bge-large-zh-v1.5:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      # 1.3GB 模型在 CPU 上冷启动需要较长时间，给足预热窗口
      start_period: 300s

  qdrant:
    # 向量库（见 ADR-007）：chunk 向量的持久化与相似度检索
    image: qdrant/qdrant:v1.16
    container_name: deepsearch-qdrant
    restart: unless-stopped
    ports:
      # 6333 = REST API + Web dashboard（http://localhost:6333/dashboard）
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      # 向量持久化：容器重建后索引仍在，不必重新摄入
      - deepsearch_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  elasticsearch:
    # 关键词检索路（见 ADR-008）：IK 中文分词 + 倒排索引 + BM25 打分
    # 自建镜像只做一件事——把 analysis-ik 插件装进去（插件包随仓库提供，构建不联网）
    build: ./elasticsearch
    image: deepsearch-elasticsearch:8.19.10
    container_name: deepsearch-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # 本地开发关闭 xpack 安全：省去证书与账号配置（生产环境必须开启）
      xpack.security.enabled: "false"
      # 本机总内存约 8GB，且要同时跑 embedding（1.3G 模型）与 qdrant；
      # 617 个 chunk 的索引极小，512MB heap 绰绰有余，
      # 不限制的话 ES 会按宿主内存取一半（2GB+）把机器吃紧
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      TZ: Asia/Shanghai
    ports:
      # 默认 9201，避开本机可能已被占用的 9200（如电商问数项目的 elasticsearch 容器）
      - "${ES_PORT:-9201}:9200"
    volumes:
      - deepsearch_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  kibana:
    # 可选可视化：ES 的数据浏览与检索调试（对应 Qdrant 自带的 dashboard）
    # 默认不启动，需要时用 --profile kibana 显式开启（镜像约 2.1GB）
    image: kibana:8.19.10
    container_name: deepsearch-kibana
    profiles: ["kibana"]
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      TZ: Asia/Shanghai
    ports:
      # 默认 5602，避开电商问数项目 kibana 用的 5601
      - "${KIBANA_PORT:-5602}:5601"
    volumes:
      - deepsearch_kibana_data:/usr/share/kibana/data
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  deepsearch_mysql_data:
  deepsearch_qdrant_data:
  deepsearch_es_data:
  deepsearch_kibana_data:
