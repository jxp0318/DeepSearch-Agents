      mixed: "2025年美国市场 Volvo / Mercedes-Benz / Stellantis 的 EV sales share 分别是多少？Nissan 的 BEV 占比是多少？"
    notes: "锚点取自 Figure 10（美国车企，物理页 12）。同为三连值长组合，新索引命中 1~2 chunk、旧索引 0。"
