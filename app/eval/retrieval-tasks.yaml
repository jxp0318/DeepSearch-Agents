        patterns: ["Vietnam reached an EV sales share of 37%"]

  - id: icct-q7
    kb: 新能源汽车出海
    doc: ICCT-Global-EV-Market-Monitor-2025.pdf
    doc_lang: en
    queries:
      zh: "2025年中国、日本、韩国生产的电动汽车主要在国内销售还是出口？"
      en: "In 2025, were EVs produced in China, Japan, and South Korea mainly sold domestically or exported?"
      mixed: "2025年 China、Japan、South Korea 生产的 EVs 主要是 sold domestically 还是 exported？"
    facts:
      - name: 中国生产87%内销
        patterns: ["87% of EVs produced in China were sold domestically"]
      - name: 日本70%出口
        patterns: ["Japan (70%)"]
      - name: 韩国56%出口
        patterns: ["South Korea (56%)"]

