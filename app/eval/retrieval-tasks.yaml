# 检索层评测集（fact-anchor 版）
#
# 唯一消费方：app/eval/eval_retrieval.py（每次运行从本文件读题，不再把题目写在代码里）。
# 新增题目 = 追加一条 case + 按下方铁律校准锚点；改题目不需要动代码。
#
# ---------------------------------------------------------------------------
# 锚点校准铁律（都是实际踩过的坑，见 app/eval/eval.md 第 5 节）
#   1. 锚点必须对着原文核，不能凭记忆写：原文写作 `2,859`（带千分位），
#      锚点写 `2859` 会永远判不中，系统性压低 Recall。
#   2. 裸百分比不能当锚点：含 `20%` 的 chunk 占 IEA 全文 5.9%、`30%` 占 4.4%，
#      且会跨文档命中同库的中文报告。一律改用英文长短语。
#   3. 锚点要指向「正确的那件事」：`one in four` 在 IEA 原文里指中国出口，
#      而「全球每四辆新车一辆电动」的原文是 `one-quarter of all new cars`。
#   4. PDF 提取会留双空格：原文 `more  than 30%` 导致 `more than 30% to reach`
#      命中 0，改用 `30% to reach` 才匹配——锚点要避开跨空格的片段。
#   5. 写完先做特异性校验：统计每个锚点在库内命中的 chunk 数与占比，
#      0 命中或占比 >3% 的一律回炉重写。
#
# ---------------------------------------------------------------------------
# 字段说明
#   id        题目编号（报告与明细里用它定位）
#   kb        知识库名（= docs/knowledge_base/ 下的目录名，检索按此过滤）
#   doc       答案所在文档的文件名（= 该文档入库时的 <doc> 元数据）。跳过判定的依据：
#             只有「所属知识库已入库」且「该文档在库内的 meta.files 清单里」才跑该题。
#             注意必须下沉到文档级——一个知识库常含多份文档，仅看库是否存在会把
#             「锚在未入库文档上」的题目当成有效题，全 0 分混进报表（2026-10-10 踩到）
#   doc_lang  答案所在文档的语言（zh/en），用于「查询语言 × 文档语言」二维分组，
#             这是定位跨语言失配的关键维度
#   queries   问句集合：至少含 zh；有 en/mixed 的题目按查询语言分组统计。
#             同一题的多个问句共享同一组 facts（锚点描述的是事实，与问句语言无关）
#   facts     fact 级锚点：每个 fact 含一组 patterns，Top-k 拼接文本里任一 pattern
#             出现即视为该事实被召回。patterns 为「或」关系，用于兼容原文的多种写法
#   gold      chunk 级 gold（② 2026-10-11 新增）：该题标准答案应落在哪些 chunk 上，
#             主键 = content_hash（v3 schema 字段，随文本稳定；**重切块后须重标**）。
#             有 gold 的题，chunk 级指标（★Recall@5 / AP@5 / MRR@5 / NDCG@5）由 gold **真值**
#             判定「相关块」；无 gold 的题回落到「含任一锚点即相关」的近似，报告里会标注。
#   notes     校准说明（为什么用这个锚点、原文怎么写），不参与计算
#
# 锚点校准工具（铁律 #5 的自动化版本）：
#   python -m app.eval.calibrate_retrieval [--write]
#   对每个 pattern 统计当前索引里的命中 chunk 数与占比，标出 FAIL-0（0 命中）/
#   WARN-BROAD（占比 >3%）/ WARN-CROSS（命中非答案文档）/ WARN-SPACE（双空格差异）。
# chunk 级 gold 的生成/校验：
#   python -m app.eval.build_gold [--check]
#   打印可直接粘贴回本题库的 gold 块；--check 校验已有 gold 是否与当前索引一致
#   （重切块后 hash 对不上会立刻报「gold 失效」，提示重标）。
# ---------------------------------------------------------------------------

cases:
  # ===================== 新能源汽车出海 / ICCT（英文文档，schema v3 后 310 chunk）=====================
