    notes: "「自动驾驶」命中 53/2767（1.9%），是三个场景词中最泛的一个，但作为「场景清单」的宽松判定可接受；四要素只保留原文写法「车-路-网-云」（5 chunk）"
    facts:
      - name: 场景：智能座舱
        patterns: ["智能座舱"]
      - name: 场景：组合驾驶辅助
        patterns: ["组合驾驶辅助"]
      - name: 场景：自动驾驶
        patterns: ["自动驾驶"]
      - name: 四要素：车-路-网-云
        patterns: ["车-路-网-云"]

  - id: kb-09
    kb: 新能源汽车出海
    doc: 德勤-生成式AI驱动汽车产业价值重构.pdf
    doc_lang: zh
    queries:
      zh: "德勤与亚马逊云科技联合发布的《生成式AI驱动汽车产业价值重构》白皮书中，生成式 AI 在汽车产业的哪些环节推动了价值重构？这份白皮书的撰写分工是怎样的？"
    notes: >-
      只保留可客观判定的事实。「价值重构环节」过于笼统（研发 / 营销这类泛词命中率
      1.6% / 0.9%，判不出真假），不参与计算。撰写分工原文：德勤负责【摘要，第一、二、
      三、五章节】，亚马逊云科技负责【第四章】。
    facts:
      - name: 撰写分工：德勤负责摘要及第一、二、三、五章
        patterns: ["第一、二、三、五"]

  - id: kb-10
    kb: 新能源汽车出海
    doc: IEA-Global EV Outlook 2026.pdf
    doc_lang: en
    queries:
      zh: "依据 IEA《Global EV Outlook 2026》，2025 年全球电动汽车销量与市场份额是多少？欧洲市场增长情况如何？报告如何描述中国在电动汽车出口与海外市场中的角色？"
    notes: >-
      三条校准要点（都是实际踩到的坑）：1) 裸百分比在 IEA 里极泛（含 "20%" 的 chunk 占
      5.9%、"30%" 占 4.4%），且会命中同库的中文德勤报告，一律改用英文长短语作锚点；
      2) 原文对全球份额的表述是 "one-quarter of all new cars"，而 "one in four" 在文中
      指中国出口（"over one in four electric cars ... made in China"），用它当锚点会判到
      错误的事实上；3) 该文档全文英文，检索侧 embedding 是中文优化的 bge-large-zh-v1.5，
      构成天然的跨语言检索样本。
    facts:
      - name: 2025 全球销量超 2000 万辆
        patterns: ["exceed 20 million", "topped 20 million"]
      - name: 全球每四辆新车一辆电动（one-quarter）
        patterns: ["one-quarter of all new cars"]
      - name: 欧洲销量增长超 30%
        patterns: ["30% to reach"]
      - name: 欧洲占其总销量 28%
        patterns: ["28% of total sales"]
      - name: 中国汽车出口中电动车超 35%
        patterns: ["35% of China"]
      - name: 非欧美市场中国进口车占 55%
        patterns: ["55% of electric car sales"]
