    #   p14/body 382707d5db000209 ← Volvo 美国销售份额 31.3% / BEV 占比 47.6% / 市占 0.8%、奔驰美国销售份额 14.1% / BEV 占比 30.1% / 市占 2.1%、Stellantis 美国销售份额 10.5% / BEV 占比 15.7% / 市占 7.7%
