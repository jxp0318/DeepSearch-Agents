  # ============ 数值事实锚点（2026-10-11 新增，⑦ 切换前按 Plan §4 补齐）============
  # 起因：Plan §4 指出——旧题库 44 查询 / 58 锚点**几乎全是文字事实**，完全没暴露
  # 「pypdf 把图表数字解成字形名（/zero.tab /comma.tab …）」这条 20% 乱码。
  # 以下锚点全部取自乱码最重的图表页（Figure 1 / 9 / 10），并逐条做了两件事：
  #   1) 特异性校验：新索引内命中 chunk 数 = 1~2（≤0.7%），远低于 3% 阈值；
  #   2) 反向校验：**在旧 pypdf 索引里命中 0** —— 数字当时被乱码吃掉，
  #      所以这组锚点正是「乱码修复到底修好了没有」的直接证据（见
  #      docs/pdf-parsing-step7.md 的锚点对照表）。
  # 锚点形态刻意用「连续三个数值」的长组合（如 Volvo 的销售份额 / 纯电占比 / 市占），
  # 单个百分比太泛，三连值既唯一又天然绑定了表格列语义。

  - id: icct-q8
    kb: 新能源汽车出海
    doc: ICCT-Global-EV-Market-Monitor-2025.pdf
    doc_lang: en
    queries:
      zh: "2025年欧洲市场，Volvo、BMW 和大众集团（VW Group）的电动车销售份额（EV sales share）、其电动车中纯电（BEV）所占比例、以及它们各自的轻型车市场份额分别是多少？Tesla 在欧洲的轻型车市场份额是多少？"
      mixed: "2025年欧洲市场 Volvo / BMW / VW Group 的 EV sales share、BEV 占比和 LDV market share 分别是多少？Tesla 在欧洲的 LDV market share 是多少？"
    notes: "锚点取自 Figure 9（欧洲车企，物理页 12）。该页在旧 pypdf 索引里有 13 个乱码 chunk；三连值锚点在新索引命中 1 chunk、旧索引 0。"
    facts:
      - name: Volvo 销售份额 67.3% / BEV 占比 59.3% / 市占 2.5%
        patterns: ["67.3% 59.3% 2.5%"]
      - name: BMW 销售份额 41.5% / BEV 占比 64.6% / 市占 6.4%
        patterns: ["41.5% 64.6% 6.4%"]
      - name: 大众集团销售份额 29.6% / BEV 占比 66.2% / 市占 25.1%
        patterns: ["29.6% 66.2% 25.1%"]
      - name: Tesla 欧洲轻型车市占 1.6%
        patterns: ["100.0% 100.0% 1.6%"]
    # gold: 最小覆盖集（1 块）—— 覆盖全部锚点的最少块，主键 = content_hash
    #   p12/body 891518995df1de69 ← Volvo 销售份额 67.3% / BEV 占比 59.3% / 市占 2.5%、BMW 销售份额 41.5% / BEV 占比 64.6% / 市占 6.4%、大众集团销售份额 29.6% / BEV 占比 66.2% / 市占 25.1%、Tesla 欧洲轻型车市占 1.6%
    gold: [891518995df1de69]

