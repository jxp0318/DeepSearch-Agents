      - name: 全球销量超2000万
        patterns: ["over 20 million"]
      - name: 占新LDV约25%
        patterns: ["about 25% of new LDVs"]
    # gold: 最小覆盖集（1 块）—— 覆盖全部锚点的最少块，主键 = content_hash
    #   p1/body fc3711e9dac519d8 ← 全球销量超2000万、占新LDV约25%
    gold: [fc3711e9dac519d8]

