    kb: 人工智能产业
    doc: 斯坦福-2026年人工智能指数报告（官方中文版）.pdf
    doc_lang: zh
    queries:
      zh: "斯坦福《2026 年人工智能指数报告》如何判断中美 AI 模型性能差距？报告给出的 AI 私人投资规模、生成式 AI 采用率与 AI 事故数量分别是多少？它用什么说法描述 AI 能力发展的不均衡？"
    notes: "校准要点：投资额原文写作「2,859 亿美元」（带千分位逗号），锚点写 2859 会永远判不中"
    facts:
      - name: 中美模型差距 2.7%
        patterns: ["2.7%"]
      - name: 美国私人 AI 投资 2,859 亿美元
        patterns: ["2,859"]
      - name: 生成式 AI 采用率 88%（组织）
        patterns: ["88%"]
      - name: 生成式 AI 采用率 53%（人口）
        patterns: ["53%"]
      - name: AI 事故 362 起（2025）
        patterns: ["362"]
      - name: AI 事故 233 起（2024）
        patterns: ["233"]
      - name: 「锯齿状」智能
        patterns: ["锯齿"]

  - id: kb-08
