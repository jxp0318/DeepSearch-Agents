  # ===================== 单语题（等对应知识库入库后可跑）=====================
  # 这几题的锚点锚在「人工智能产业」与「新能源汽车出海」的其他文档上。
  # 对应文档尚未重新入库时，eval_retrieval 会自动跳过并告警（不会当成 0 分计入）。

  - id: kb-06
    kb: 人工智能产业
    doc: 中国信通院-具身智能发展报告（2025年）.pdf
    doc_lang: zh
    queries:
      zh: "中国信通院《具身智能发展报告（2025年）》中，截至 2025 年 12 月我国具身智能和机器人领域的投资事件数与融资总额分别是多少？报告把具身智能产品分为哪两类载体，各自要解决什么问题？"
    notes: "锚点特异性已校验：744 → 3/2036 chunk、735.43 → 2、移动类 / 操作类 各 1，无假阳性风险"
    facts:
      - name: 投资事件数 744 起
        patterns: ["744"]
      - name: 融资总额 735.43 亿元
        patterns: ["735.43"]
      - name: 移动类载体（去哪里）
        patterns: ["移动类"]
      - name: 操作类载体（干什么）
        patterns: ["操作类"]

