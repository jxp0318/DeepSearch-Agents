    kb: 新能源汽车出海
    doc: ICCT-Global-EV-Market-Monitor-2025.pdf
    doc_lang: en
    queries:
      zh: "2025年中国的电动汽车销量、在全球市场中的占比，以及国内的电动车渗透率分别是多少？"
      en: "What were China's EV sales in 2025, its share of the global EV market, and its domestic EV penetration rate?"
      mixed: "2025年 China 的 EV sales、它的 global market share，以及 domestic EV penetration 分别是多少？"
    facts:
      - name: 中国销量近1300万
        patterns: ["nearly 13 million EVs were sold in China"]
      - name: 占全球约62%
        patterns: ["approximately 62%"]
      - name: 中国渗透率52%
        patterns: ["52% of new LDVs sold in the country"]

  - id: icct-q4
    kb: 新能源汽车出海
    doc: ICCT-Global-EV-Market-Monitor-2025.pdf
    doc_lang: en
    queries:
      zh: "2025年欧洲和美国的电动汽车销量及渗透率分别是多少？"
      en: "What were the EV sales volumes and penetration rates in Europe and the United States in 2025?"
      mixed: "2025年 Europe 和 United States 的 EV sales 和 penetration rate 分别是多少？"
    facts:
      - name: 欧洲销量410万
        patterns: ["4.1 million EVs were sold"]
      - name: 欧洲渗透率27%
        patterns: ["27% of all new LDVs"]
      - name: 美国销量150万
        patterns: ["1.5 million EVs in 2025"]
      - name: 美国渗透率9%
        patterns: ["9% of all new LDVs"]

  - id: icct-q5
    kb: 新能源汽车出海
    doc: ICCT-Global-EV-Market-Monitor-2025.pdf
    doc_lang: en
    queries:
      zh: "2025年印度的电动汽车销量相比2024年增长了多少？渗透率是多少？"
      en: "How much did India's EV sales grow in 2025 compared with 2024, and what was its EV penetration rate?"
      mixed: "2025年 India 的 EV sales 相比 2024 增长了多少？EV penetration 是多少？"
    facts:
      - name: 印度12.5万→20.2万
        patterns: ["125,000 in 2024 to 202,000 in 2025"]
      - name: 印度渗透率4%
        patterns: ["4% of new LDV sales"]

  - id: icct-q6
    kb: 新能源汽车出海
    doc: ICCT-Global-EV-Market-Monitor-2025.pdf
    doc_lang: en
    queries:
      zh: "2025年新兴市场的电动汽车销量表现如何？哪个国家的电动车渗透率最高？"
      en: "How did EV sales perform in emerging markets in 2025, and which country had the highest EV sales share?"
      mixed: "2025年 emerging markets 的 EV sales 表现如何？哪个国家 EV sales share 最高？"
    facts:
      - name: 新兴市场合计200万
        patterns: ["approximately 2 million EVs were sold in these markets collectively"]
      - name: 11个新兴市场约100万
        patterns: ["11 emerging markets sold approximately 1 million EVs"]
