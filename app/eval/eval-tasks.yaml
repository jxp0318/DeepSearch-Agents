    specifications: "0.3g*20粒"
  faithfulness_anchors:
    - { text: "芬必得", kind: entity }
    - { text: "0.3g*20粒", kind: number }
  required_citations:
    - claim: "布洛芬缓释胶囊的商品名与规格"
      must_cite: true
