# =============================================================================
# deepsearch-agents 生成层评测集 v1（30 条）
#
# 口径（2026-10-15 定稿，与 app/eval/eval.md 第 10 节配套）：
#   · **单臂**：只评测「最新版」配置（反思 3 轮 + 引用规范 + 检索 hybrid_rerank）。
#     暂不设「原始版」对照臂，因此本表产出的是**绝对值**，不含「提升了多少」。
#   · 每条任务跑 3 次（LLM 非确定性），3 次中 ≥2 次 pass 记为该任务 pass。
#   · 7 个指标：任务成功率 / 答案正确率 / Faithfulness / 引用准确率 /
#     平均工具调用次数 / P50-P95 延迟 / 单任务 API 成本。
#
# 字段说明（新增字段是为了让 7 个指标可判，均为可选但强烈建议填全）：
#   gold_facts            答案正确率：报告必须覆盖的关键事实（judge 逐条语义核对）
#   gold_answer           答案正确率：可程序化精确校验的答案（仅 DB 数值类；已按库内
#                         真实数据实测回填，2026-10-15）
#   faithfulness_anchors  语料存在性补充清单（2026-10-15 起**不再参与判分**，判分改用
#                         claim 级 anchors）；可回原文逐字比对的最小事实单元
#                         （只收数字 / 专名 / 术语；描述型判断不进）
#   required_citations    引用准确率：哪些结论必须带引用
#                         cite_kind: chunk      → 须标【引用BN-I】
#                           anchor_match: true → 参与 Faithfulness，并须配 `anchors`：
#                             该 claim 专属的锚点（数字/专名），判据 = judge 抄回的
#                             「这句话挂的编号」所指向的 chunk 含任一锚点
#                             跑 `--check-anchors` 确认锚点能逐字命中
#                           综合/对比类 claim 不配 anchor_match（证据不是一句可比对的话，
#                             硬配只会送分），交给 judge 单判
#                         cite_kind: query_cond → DB 类，判据 = 写明表名与筛选条件
#                         cite_kind: url        → 网络类，判据 = 给出来源链接
#   require_file          是否必须产出 md / pdf
#   expected_rounds       期望迭代轮数（用于「反思是否真的在起作用」）
#   max_tool_calls        工具调用上限，超出记为跑偏（跑偏不直接判 fail，但会在报告里标出）
#
# ⚠️ 时间敏感题（跑批前必读）：
#   db-04 的答案依赖运行日期（批次 MY-250101-A 于 2027-01-01 到期），2027-01-01 之后
#   本题会「无数据可答」，届时须换成新的时间窗口，不要保留一个恒空的 gold。
#   web-* 五题答案随时间漂移，judge 只核「论断与来源是否自洽」，不核具体数值。
# =============================================================================

