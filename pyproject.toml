[project]
name = "deepsearch-agents"
version = "0.1.0"
description = "Deep research agent with autonomous planning, a reflection loop and a self-built hybrid RAG pipeline."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiofiles>=23.0.0",
    "deepagents==0.5.7",
    "elasticsearch>=8,<9",
    "fastapi>=0.100.0",
    "jieba>=0.42.1",
    "langchain==1.2.17",
    "langchain-community>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai==1.2.1",
    "langgraph==1.1.10",
    "markdown>=3.5",
    "mysql-connector-python>=8.0.0",
    "numpy>=1.26.0",
    "openai>=1.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "pypdf>=3.0.0",
    "python-docx>=1.0.0",
    "python-dotenv==1.2.2",
    "python-multipart>=0.0.6",
    # PPTX 解析（非 PDF 统一结构化链路，见 docs/design.md ADR-017）
    "python-pptx>=1.0.0",
    "pyyaml>=6.0",
    "qdrant-client>=1.14,<1.17",
    "rank-bm25>=0.2.2",
    # 扫描页 OCR（C4 实现端）。可选依赖：缺失时 app/rag/ocr.py 自动降级为「无 OCR」，
    # 解析照常完成、扫描页仍带 needs_ocr 标记。纯 onnx，复用现有 onnxruntime。
    "rapidocr-onnxruntime>=1.4.4",
    "reportlab>=4.0.0",
    "requests>=2.31.0",
    "tavily-python==0.7.24",
    "typing-extensions>=4.5.0",
    "uvicorn[standard]>=0.20.0",
]

[tool.uv]
package = false
